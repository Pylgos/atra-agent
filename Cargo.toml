[workspace]
members = [
    "crates/atra",
    "crates/atra-controller",
    "crates/atra-protocol",
    "crates/atra-runner",
    "crates/atra-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.100"
atra-controller = { path = "crates/atra-controller" }
atra-protocol = { path = "crates/atra-protocol" }
atra-runner = { path = "crates/atra-runner" }
atra-tui = { path = "crates/atra-tui" }
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
insta = "1.46.1"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.2", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-width = "0.2.2"
xdg = "3.0.0"
