[workspace]
members = [
    "crates/atra-cli",
    "crates/atra-controller",
    "crates/atra-platform",
    "crates/atra-protocol",
    "crates/atra-runner",
    "crates/atra-tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.100"
atra-controller = { path = "crates/atra-controller" }
atra-platform = { path = "crates/atra-platform" }
atra-protocol = { path = "crates/atra-protocol" }
atra-runner = { path = "crates/atra-runner" }
atra-tui = { path = "crates/atra-tui" }
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
codex-api = { git = "https://github.com/openai/codex.git", rev = "9e1f43dc2da77b0b25bb30bf60d6b5db34afc954" }
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "9e1f43dc2da77b0b25bb30bf60d6b5db34afc954" }
codex-login = { git = "https://github.com/openai/codex.git", rev = "9e1f43dc2da77b0b25bb30bf60d6b5db34afc954" }
codex-model-provider-info = { git = "https://github.com/openai/codex.git", rev = "9e1f43dc2da77b0b25bb30bf60d6b5db34afc954" }
codex-models-manager = { git = "https://github.com/openai/codex.git", rev = "9e1f43dc2da77b0b25bb30bf60d6b5db34afc954" }
codex-protocol = { git = "https://github.com/openai/codex.git", rev = "9e1f43dc2da77b0b25bb30bf60d6b5db34afc954" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
http = "1.3.1"
insta = "1.46.1"
icu_segmenter = "2.2.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.2", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
toml = "0.9.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-width = "0.2.2"
xdg = "3.0.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
