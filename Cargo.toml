[workspace]
members = [
    "crates/atra-cli",
    "crates/atra-client",
    "crates/atra-controller",
    "crates/atra-id",
    "crates/atra-patch",
    "crates/atra-patch-types",
    "crates/atra-platform",
    "crates/atra-protocol",
    "crates/atra-runner",
    "crates/atra-store",
    "crates/atra-tui",
    "crates/atra-tree",
    "crates/atra-web",
    "crates/atra-web-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.91"
atra-controller = { path = "crates/atra-controller" }
atra-id = { path = "crates/atra-id" }
atra-patch = { path = "crates/atra-patch" }
atra-patch-types = { path = "crates/atra-patch-types" }
atra-client = { path = "crates/atra-client" }
atra-platform = { path = "crates/atra-platform" }
atra-protocol = { path = "crates/atra-protocol" }
atra-runner = { path = "crates/atra-runner" }
atra-store = { path = "crates/atra-store" }
atra-tree = { path = "crates/atra-tree" }
atra-tui = { path = "crates/atra-tui" }
atra-web = { path = "crates/atra-web" }
axum = "0.8.7"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
console_error_panic_hook = "0.1.7"
clap = { version = "4.5.51", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
http = "1.3.1"
indoc = "2.0.7"
insta = "1.46.1"
icu_segmenter = "2.2.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
rand = "0.9.5"
reqwest = { version = "0.12.28", default-features = false, features = ["cookies", "json", "rustls-tls-native-roots", "stream"] }
rpassword = "7.4.0"
rustix = { version = "1.1.2", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
os_info = "3.12.0"
similar = "3.1.1"
syntect = "5.3.0"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = [
    "io-std",
    "io-util",
    "fs",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
tower = "0.5.2"
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "0.9.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tiktoken-rs = "0.9.1"
tui-markdown = "0.3.9"
webbrowser = "1.0.6"
unicode-width = "0.2.2"
xdg = "3.0.0"
yaml-rust = "0.4.5"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[profile.wasm-release]
inherits = "release"
debug = 0
strip = "debuginfo"
